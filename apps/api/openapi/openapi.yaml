openapi: 3.0.3
info:
  title: ProSlides API
  version: 0.1.0
  description: Contract-first API for the Go modular monolith.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness probe.
      responses:
        '200':
          description: The API process can serve requests. This endpoint does not check dependencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadiness
      summary: Required dependency readiness probe.
      responses:
        '200':
          description: PostgreSQL and Redis are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: At least one required dependency is unavailable or not configured. Driver errors and connection details are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: API version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/live/sessions/{sessionId}/events:
    get:
      operationId: subscribeLiveSession
      summary: Subscribe to server-sent live events.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: text/event-stream response
          content:
            text/event-stream:
              schema:
                type: string
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Readiness:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    Version:
      type: object
      required: [service, environment, api_version]
      properties:
        service: { type: string }
        environment: { type: string }
        api_version: { type: string }
