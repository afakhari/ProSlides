<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manager Client</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
    button { margin: 5px; padding: 10px 20px; font-size: 16px; }
    #log { background: white; border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Manager Client</h1>
  <label>Session ID: <input id="sessionId" value="room1"></label>
  <button id="connectBtn">Connect</button>
  <br><br>
  <button id="nextBtn" disabled>Next</button>
  <button id="prevBtn" disabled>Previous</button>
  <h3>Messages:</h3>
  <div id="log"></div>

  <script>
    let ws;
    const logDiv = document.getElementById("log");

    function log(msg) {
      const div = document.createElement("div");
      div.textContent = msg;
      logDiv.appendChild(div);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    document.getElementById("connectBtn").onclick = () => {
      const sessionId = document.getElementById("sessionId").value.trim();
      ws = new WebSocket(`ws://localhost:8080/ws/${sessionId}/manager`);

      ws.onopen = () => {
        log("✅ Connected as manager");
        document.getElementById("nextBtn").disabled = false;
        document.getElementById("prevBtn").disabled = false;
      };

      ws.onmessage = (event) => {
        log("📩 " + event.data);
      };

      ws.onclose = () => log("❌ Disconnected");
    };

    document.getElementById("nextBtn").onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send("next");
      log("➡️ Sent: next");
    };

    document.getElementById("prevBtn").onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send("previous");
      log("⬅️ Sent: previous");
    };
  </script>
</body>
</html>
